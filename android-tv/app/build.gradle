plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.velora.app'
    compileSdk 35

    defaultConfig {
        applicationId 'tv.velora.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}


dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
}
