name: Deploy Velora V3 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild V3 static bundle
        run: |
          cat .deploy/bundle.part* > /tmp/velora.b64
          base64 --decode /tmp/velora.b64 > /tmp/velora.zip
          mkdir -p /tmp/velora-dist
          unzip -o /tmp/velora.zip -d /tmp/velora-dist
          test -f /tmp/velora-dist/index.html
          test -f /tmp/velora-dist/app.js
          test -f /tmp/velora-dist/styles.css

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/velora-site gh-pages
          find /tmp/velora-site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/velora-dist/. /tmp/velora-site/
          touch /tmp/velora-site/.nojekyll
          cd /tmp/velora-site
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes."
          else
            git commit -m "Deploy full Velora V3 catalogue experience"
            git push origin gh-pages
          fi
