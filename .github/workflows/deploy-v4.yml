name: Deploy Velora TV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velora-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate app and real-source layer
        run: |
          node --check server.mjs
          node --check app.js
          node --check real-v5-data.js
          node --check real-v5-home.js
          node --check real-v5-live.js
          node --check real-v5-runtime.js
          node --check real-v6-media.js
          node --check real-v6-ui.js
          node --check real-v7-ingest.js
          node --check real-v8-vod.js
          node --check real-v9-client.js
          node --check real-v10-provider-preview.js
          node --check install.js
          node --check tv-mode.js
          node --check auth-client.js
          test -f index.html
          test -f styles.css
          test -f real-v5.css
          test -f real-v6.css
          test -f real-v7.css
          test -f real-v8-vod.css
          test -f real-v9-client.css
          test -f real-v10-provider-preview.css
          test -f install.css
          test -f tv-mode.css
          test -f auth.css
          test -f icons/icon.svg
          test -f icons/icon-192.png
          test -f icons/icon-180.png
          test -f manifest.json
          curl -fsSL --retry 3 --max-time 20 "https://archive.org/advancedsearch.php?q=collection%3Afeature_films%20AND%20mediatype%3Amovies&fl%5B%5D=identifier&fl%5B%5D=title&rows=1&page=1&output=json" -o /tmp/archive-check.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/archive-check.json'))
          assert 'response' in d and 'numFound' in d['response']
          print('Internet Archive catalogue reachable:', d['response']['numFound'])
          PY

      - name: Publish static app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages /tmp/velora-site origin/gh-pages
          find /tmp/velora-site -mindepth 1 -maxdepth 1 ! -name .git ! -name downloads -exec rm -rf {} +
          cp index.html app.js styles.css install.css install.js tv-mode.css tv-mode.js auth.css auth-client.js real-v5.css real-v5-data.js real-v5-home.js real-v5-live.js real-v5-runtime.js real-v6.css real-v6-media.js real-v6-ui.js real-v7.css real-v7-ingest.js real-v8-vod.css real-v8-vod.js real-v9-client.css real-v9-client.js real-v10-provider-preview.css real-v10-provider-preview.js manifest.json sw.js /tmp/velora-site/
          cp -R icons /tmp/velora-site/
          cp demo-authorized-catalog.json demo-distributor-catalog.csv demo-authorized-playlist.m3u demo-epg.xml /tmp/velora-site/ 2>/dev/null || true
          touch /tmp/velora-site/.nojekyll
          cd /tmp/velora-site
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes."
          else
            git commit -m "Deploy Velora Universal Install V11"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
