<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velora TV</title><style>*{box-sizing:border-box}body{margin:0;background:#080a10;color:#fff;font:15px system-ui,Segoe UI,sans-serif}button,input{font:inherit}.hide{display:none}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#6246ea55,transparent 35%),#080a10;padding:20px}.box{width:min(420px,100%);background:#111522;border:1px solid #ffffff20;border-radius:24px;padding:28px}.brand{font-weight:900;letter-spacing:.15em}.brand b{background:linear-gradient(135deg,#7a5cff,#12d8d8);padding:8px 11px;border-radius:10px;margin-right:8px}.box h1{font-size:38px;margin:28px 0 8px}.muted{color:#a8afbf}.box input,.search{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff1f;background:#090b12;color:#fff;margin:7px 0}.primary,.ghost{border:0;border-radius:12px;padding:12px 16px;cursor:pointer}.primary{background:#fff;color:#080a10;font-weight:800}.ghost{background:#ffffff12;color:#fff;border:1px solid #ffffff18}.wide{width:100%;margin-top:10px}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:16px 4vw;background:#080a10e8;backdrop-filter:blur(12px)}.nav{display:flex;gap:5px;margin-left:auto}.nav button{border:0;background:transparent;color:#a8afbf;padding:9px 11px;border-radius:9px}.nav button.on{background:#ffffff12;color:#fff}.hero{min-height:58vh;padding:12vh 5vw 5vh;display:flex;align-items:end;background-size:cover;background-position:center;position:relative}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#080a10 5%,#080a10c8 40%,transparent),linear-gradient(0deg,#080a10,transparent 45%)}.copy{position:relative;z-index:1;max-width:600px}.copy h1{font-size:clamp(42px,7vw,72px);margin:6px 0}.tag{color:#7be7e7;font-size:12px;font-weight:900;letter-spacing:.14em}.content,.page{padding:22px 4vw}.rail{display:grid;grid-auto-flow:colum search','admin'];function tile(x,p){return'<article class="tile '+(p?'poster':'')+'" data-id="'+x.id+'"><div class="art" style="background-image:url(\''+x.art+'\')"></div><b>'+x.title+'</b><small>'+x.genre+'</small></article>'}function nav(){var h='';views.forEach(function(v){h+='<button class="'+(view===v?'on':'')+'" data-view="'+v+'">'+(v[0].toUpperCase()+v.slice(1))+'</button>'});document.getElementById('nav').innerHTML=h;document.getElementById('mobile').innerHTML=h}function home(){var h=items[0];return'<section class="hero" style="background-image:url(\''+h.art+'\')"><div class="copy"><div class="tag">VELORA ORIGINAL</div><h1>'+h.title+'</h1><p class="muted">'+h.desc+'</p><button class="primary" data-play="'+h.id+'">▶ Play</button> <button class="ghost" data-id="'+h.id+'">More info</button></div></section><section class="content"><h2>Live now</h2><div class="rail">'+channels.map(function(c){return'<article class="tile" data-live="'+c.id+'"><div class="art" style="background-image:url(\''+A+'photo-1522869635100-9f4c5e86aa37?auto=format&fit=crop&w=800&q=80\')"></div><b>'+c.name+'</b><small>'+c.now+'</small></article>'}).join('')+'</div><h2>Trending</h2><div class="rail">'+items.map(function(x){return tile(x,false)}).join('')+'</div></section>'}function cat(t){return'<section class="page"><div class="tag">ON DEMAND</div><h1>'+(t==='movie'?'Movies':'Series')+'</h1><p class="muted">Unified catalogue ready for licensed provider feeds.</p><div class="grid">'+items.filter(function(x){return x.type===t}).map(function(x){return tile(x,true)}).join('')+'</div></section>'}function live(){return'<section class="page"><div class="tag">LIVE TV</div><h1>Guide</h1><div class="live"><div class="channels">'+channels.map(function(c,i){return'<button class="channel '+(i?'':'on')+'" data-channel="'+c.id+'"><b>'+c.id+' · '+c.name+'</b><br><small>'+c.now+'</small></button>'}).join('')+'</div><div class="screen"><video id="player" controls autoplay playsinline src="'+channels[0].url+'"></video><div class="now"><div class="tag">NOW PLAYING</div><h2 id="now">'+channels[0].name+'</h2><p id="prog" class="muted">'+channels[0].now+'</p></div></div></div></section>'}function search(){return'<section class="page"><div class="tag">UNIVERSAL SEARCH</div><h1>Find something</h1><input id="q" class="search" placeholder="Search titles or genres"><div id="results" class="grid">'+items.map(function(x){return tile(x,true)}).join('')+'</div></section>'}function admin(){return'<section class="page"><div class="tag">CATALOGUE HUB</div><h1>Admin / Feed</h1><div class="admin"><h3>GitHub Pages preview</h3><p class="muted">This front end is live. Authorized M3U/XMLTV/API provider sync, billing, subscriber entitlements and protected playback will use a separate secure backend because GitHub Pages cannot run Node servers.</p><p><b>'+channels.length+'</b> live channels · <b>'+items.length+'</b> VOD demo titles · Territory: <b>JM</b></p></div></section>'}function render(){nav();var m=document.getElementById('main');m.innerHTML=view==='home'?home():view==='live'?live():view==='movies'?cat('movie'):view==='series'?cat('series'):view==='search'?search():admin()}function show(id,play){var x=items.find(function(z){return z.id===id});if(!x)return;document.getElementById('detail').innerHTML='<div class="detailTop" style="background-image:url(\''+x.art+'\')"></div><div class="detailBody"><div class="tag">'+x.genre+'</div><h1>'+x.title+'</h1><p class="muted">'+x.desc+'</p><button class="primary" id="p">▶ Play</button> <button class="ghost" id="c">Close</button><video id="v" class="hide" style="width:100%;margin-top:15px" controls src="'+x.url+'"></video></div>';document.getElementById('modal').classList.add('on');document.getElementById('c').onclick=function(){document.getElementById('modal').classList.remove('on')};document.getElementById('p').onclick=function(){var v=document.getElementById('v');v.classList.remove('hide');v.play()};if(play)document.getElementById('p').click()}function enter(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');render()}document.getElementById('form').onsubmit=function(e){e.preventDefault();if(email.value==='demo@velora.app'&&pass.value==='demo1234')enter()};document.getElementById('demo').onclick=enter;document.getElementById('out').onclick=function(){app.classList.add('hide');login.classList.remove('hide')};document.addEventListener('click',function(e){var b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render();scrollTo(0,0);return}b=e.target.closest('[data-id]');if(b){show(b.dataset.id,false);return}b=e.target.closest('[data-play]');if(b){show(b.dataset.play,true);return}b=e.target.closest('[data-live]');if(b){view='live';render();return}b=e.target.closest('[data-channel]');if(b){var c=channels.find(function(z){return z.id===b.dataset.channel});document.querySelectorAll('.channel').forEach(function(x){x.classList.remove('on')});b.classList.add('on');player.src=c.url;player.play();now.textContent=c.name;prog.textContent=c.now}});document.addEventListener('input',function(e){if(e.target.id==='q'){var s=e.target.value.toLowerCase();results.innerHTML=items.filter(function(x){return(x.title+' '+x.genre).toLowerCase().includes(s)}).map(function(x){return tile(x,true)}).join('')}});modal.onclick=function(e){if(e.target===modal)modal.classList.remove('on')};</script>
